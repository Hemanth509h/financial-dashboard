<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <meta name="theme-color" content="#006a6a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GigFinance" />
  <link rel="manifest" href="/manifest.json" />
  <title>GigFinance</title>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // App shell / offline cache worker.
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('App SW registered');
          reg.update().catch(() => {});
        }).catch((err) => console.warn('App SW failed', err));

        // Dedicated Firebase Cloud Messaging worker. Registered explicitly so
        // push works on iOS PWA, Android Chrome, and desktop. Use a distinct
        // scope so it doesn't fight the app shell worker for control.
        navigator.serviceWorker.register('/firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope'
        }).then(() => {
          console.log('FCM SW registered');
        }).catch((err) => console.warn('FCM SW failed', err));
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
